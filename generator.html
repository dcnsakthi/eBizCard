<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eBizCard Key Generator</title>
    <script src="config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .output {
            margin-top: 30px;
            display: none;
        }
        
        .output.visible {
            display: block;
        }
        
        .output h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .keys-container {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .key-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .key-item:last-child {
            margin-bottom: 0;
        }
        
        .key-text {
            font-family: 'Courier New', monospace;
            color: #333;
            word-break: break-all;
            flex: 1;
        }
        
        .key-url {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 10px;
            transition: background 0.3s;
        }
        
        .copy-btn:hover {
            background: #764ba2;
        }
        
        .btn-secondary {
            background: #6c757d;
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.6);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .qr-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }
        
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        
        .qr-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }
        
        .qr-code {
            margin-bottom: 10px;
        }
        
        .qr-label {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }
        
        /* Authentication Modal Styles */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .auth-overlay.hidden {
            display: none;
        }
        
        .auth-modal {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }
        
        .auth-modal h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .auth-modal p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .auth-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }
        
        .auth-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .auth-error {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        
        .auth-error.visible {
            display: block;
        }
        
        .page-content {
            display: none;
        }
        
        .page-content.visible {
            display: block;
        }
    </style>
    <script src="qrcode.min.js"></script>
</head>
<body>
    <!-- Authentication Modal -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-modal">
            <h2>🔐 Admin Authentication</h2>
            <p>Please enter your credentials to access the QR Code Generator</p>
            <form id="authForm" onsubmit="return false;">
                <input 
                    type="text" 
                    id="username" 
                    class="auth-input" 
                    placeholder="Username" 
                    autocomplete="username"
                    required
                >
                <input 
                    type="password" 
                    id="password" 
                    class="auth-input" 
                    placeholder="Password" 
                    autocomplete="current-password"
                    required
                >
                <div id="authError" class="auth-error">Invalid username or password. Please try again.</div>
                <button type="submit" class="btn" onclick="authenticate()">Login</button>
            </form>
        </div>
    </div>
    
    <!-- Main Content (hidden until authenticated) -->
    <div id="pageContent" class="page-content">
    <div class="container">
        <h1>🔐 eBizCard Key Generator</h1>
        <p class="subtitle">Generate secure one-time access keys for your eBizCard</p>
        
        <div class="form-group">
            <label for="keyCount">Number of keys to generate:</label>
            <input type="number" id="keyCount" min="1" max="100" value="5">
        </div>
        
        <button class="btn" onclick="generateKeys()">Generate Keys</button>
        
        <div id="output" class="output">
            <h2>Generated Keys</h2>
            <div id="keysContainer" class="keys-container"></div>
            
            <div class="button-group">
                <button class="btn" onclick="downloadJSON()">Download JSON</button>
                <button class="btn btn-secondary" onclick="copyAllKeys()">Copy All URLs</button>
            </div>
            
            <div class="qr-section">
                <h2>QR Codes</h2>
                <div id="qrGrid" class="qr-grid"></div>
            </div>
        </div>
    </div>
    </div><!-- End of page-content -->
    
    <script>
        let generatedKeys = [];
        const baseURL = window.location.origin + window.location.pathname.replace('generator.html', 'index.html');
        
        function generateSecureKey(length = 20) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = '';
            const array = new Uint8Array(length);
            crypto.getRandomValues(array);
            
            for (let i = 0; i < length; i++) {
                key += chars[array[i] % chars.length];
            }
            
            return key;
        }
        
        function generateKeys() {
            const count = parseInt(document.getElementById('keyCount').value);
            
            if (count < 1 || count > 100) {
                alert('Please enter a number between 1 and 100');
                return;
            }
            
            generatedKeys = [];
            const now = new Date().toISOString();
            
            for (let i = 0; i < count; i++) {
                generatedKeys.push({
                    key: generateSecureKey(),
                    createdAt: now,
                    expiresAt: null
                });
            }
            
            displayKeys();
        }
        
        function displayKeys() {
            const container = document.getElementById('keysContainer');
            const qrGrid = document.getElementById('qrGrid');
            container.innerHTML = '';
            qrGrid.innerHTML = '';
            
            generatedKeys.forEach((keyData, index) => {
                const url = `${baseURL}?key=${keyData.key}`;
                
                // Create key item
                const keyItem = document.createElement('div');
                keyItem.className = 'key-item';
                keyItem.innerHTML = `
                    <div style="flex: 1;">
                        <div class="key-text">${keyData.key}</div>
                        <div class="key-url">${url}</div>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('${url}')">Copy URL</button>
                `;
                container.appendChild(keyItem);
                
                // Create QR code
                const qrItem = document.createElement('div');
                qrItem.className = 'qr-item';
                qrItem.innerHTML = `
                    <div class="qr-code" id="qr-${index}"></div>
                    <div class="qr-label">Key ${index + 1}</div>
                `;
                qrGrid.appendChild(qrItem);
                
                // Generate QR code
                new QRCode(document.getElementById(`qr-${index}`), {
                    text: url,
                    width: 150,
                    height: 150
                });
            });
            
            document.getElementById('output').classList.add('visible');
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('URL copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy URL to clipboard. Please copy manually: ' + text);
            });
        }
        
        function copyAllKeys() {
            const urls = generatedKeys.map(k => `${baseURL}?key=${k.key}`).join('\n');
            navigator.clipboard.writeText(urls).then(() => {
                alert('All URLs copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy URLs to clipboard. Please use the individual copy buttons.');
            });
        }
        
        function downloadJSON() {
            const json = {
                keys: generatedKeys
            };
            
            const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'keys.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }
        
        // Authentication function
        function authenticate() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const authError = document.getElementById('authError');
            
            // Validate credentials against config
            if (username === CONFIG.ADMIN_AUTH_USER_NAME && password === CONFIG.ADMIN_AUTH_SECRET_KEY) {
                // Authentication successful
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('pageContent').classList.add('visible');
                authError.classList.remove('visible');
                
                // Store authenticated session (valid for browser session)
                sessionStorage.setItem('ebizcard_admin_authenticated', 'true');
            } else {
                // Authentication failed
                authError.classList.add('visible');
                document.getElementById('password').value = '';
                document.getElementById('username').focus();
            }
        }
        
        // Check if already authenticated on page load
        window.addEventListener('DOMContentLoaded', function() {
            const isAuthenticated = sessionStorage.getItem('ebizcard_admin_authenticated');
            
            if (isAuthenticated === 'true') {
                // Skip authentication modal if already authenticated
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('pageContent').classList.add('visible');
            }
            
            // Allow Enter key to submit authentication form
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    authenticate();
                }
            });
            
            document.getElementById('username').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    authenticate();
                }
            });
        });
    </script>
</body>
</html>
