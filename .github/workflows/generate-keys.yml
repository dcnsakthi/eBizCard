name: Generate and Deploy with Keys

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      generate_new_keys:
        description: 'Number of new keys to generate'
        required: false
        default: '0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Inject secrets into index.html
        env:
          VALID_KEYS: ${{ secrets.VALID_KEYS }}
          ADMIN_AUTH_USER_NAME: ${{ secrets.ADMIN_AUTH_USER_NAME }}
          ADMIN_AUTH_SECRET_KEY: ${{ secrets.ADMIN_AUTH_SECRET_KEY }}
        run: |
          echo "Injecting VALID_KEYS into HTML files..."
          
          # Escape the keys for JavaScript
          ESCAPED_KEYS=$(echo "$VALID_KEYS" | sed 's/"/\\"/g')
          
          # Inject into index.html before the closing </body> tag
          sed -i 's|<script src="app.js"></script>|<script>const VALID_KEYS_FROM_SECRET = "'"$ESCAPED_KEYS"'";</script>\n    <script src="app.js"></script>|' index.html
          
          echo "VALID_KEYS injected into index.html"
          
          # Inject into admin.html before the comment
          sed -i 's|<!-- VALID_KEYS will be injected here during deployment -->|<script>const VALID_KEYS_FROM_SECRET = "'"$ESCAPED_KEYS"'";</script>|' admin.html
          
          echo "VALID_KEYS injected into admin.html"
          
          # Inject admin credentials into admin.html
          if [ ! -z "$ADMIN_AUTH_USER_NAME" ] && [ ! -z "$ADMIN_AUTH_SECRET_KEY" ]; then
            echo "Injecting admin credentials into admin.html..."
            sed -i "s/ADMIN_AUTH_USER_NAME_PLACEHOLDER/$ADMIN_AUTH_USER_NAME/g" admin.html
            sed -i "s/ADMIN_AUTH_SECRET_KEY_PLACEHOLDER/$ADMIN_AUTH_SECRET_KEY/g" admin.html
            echo "Admin credentials injected successfully"
          else
            echo "Warning: ADMIN_AUTH_USER_NAME or ADMIN_AUTH_SECRET_KEY not set. Using placeholder values."
          fi
          
          echo "All secrets injected successfully"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
